<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Login - Fênix Dev Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #2a2a2a;
            color: white;
        }

        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
        }

        .success {
            background: #28a745;
        }

        .error {
            background: #dc3545;
        }

        .info {
            background: #17a2b8;
        }
    </style>
</head>

<body>
    <h1>🔐 Teste de Login - Fênix Dev Academy</h1>

    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" value="admin@fenix.com">
    </div>

    <div class="form-group">
        <label for="password">Senha:</label>
        <input type="password" id="password" value="admin123">
    </div>

    <button onclick="testLogin()">Testar Login</button>
    <button onclick="clearResult()">Limpar</button>

    <div id="result"></div>

    <h3>Credenciais de Teste Disponíveis:</h3>
    <ul>
        <li><strong>Admin:</strong> admin@fenix.com / admin123</li>
        <li><strong>Usuário:</strong> user@fenix.com / user123</li>
        <li><strong>Desenvolvedor:</strong> dev@fenix.com / dev123</li>
    </ul>

    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML = 'Testando login...';
            resultDiv.className = 'result info';

            try {
                console.log('Testando login com:', email);

                const response = await fetch('/api/auth/login-simple', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                console.log('Status da resposta:', response.status);

                const data = await response.json();
                console.log('Dados da resposta:', data);

                if (response.ok && data.success) {
                    resultDiv.innerHTML = `✅ Login bem-sucedido!\n\nUsuário: ${data.user.name}\nEmail: ${data.user.email}\nRole: ${data.user.role}\nToken: ${data.token.substring(0, 20)}...`;
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.innerHTML = `❌ Erro no login:\n\nStatus: ${response.status}\nErro: ${data.error || 'Erro desconhecido'}`;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                resultDiv.innerHTML = `❌ Erro de conexão:\n\n${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        function clearResult() {
            document.getElementById('result').innerHTML = '';
            document.getElementById('result').className = 'result';
        }
    </script>
</body>

</html>
