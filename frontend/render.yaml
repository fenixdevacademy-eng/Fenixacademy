services:
  - type: web
    name: fenix-dev-academy
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NEXTAUTH_URL
        value: https://fenix-dev-academy.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true

databases:
  - name: fenix-db
    plan: free
    databaseName: fenix
    user: fenix_user




