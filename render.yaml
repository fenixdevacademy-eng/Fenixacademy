services:
  - type: web
    name: fenix-dev-academy
    env: node
    plan: starter
    buildCommand: cd frontend && npm cache clean --force && rm -rf .next out node_modules/.cache .turbo && npm install && timeout 600 npm run build:safe
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://fenixdevacademy.com.br
      - key: NEXT_PUBLIC_APP_NAME
        value: Fênix Dev Academy
    healthCheckPath: /
    autoDeploy: true
    branch: main
    rootDir: frontend